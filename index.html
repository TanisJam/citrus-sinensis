<!-- Es una pieza que se comparte por link, asi que la tarjeta social no es un
     extra: es la primera impresion en LinkedIn.

     `og.jpg` NO es un mockup: es un cuadro real del canvas en p=0.78 —viraje de
     color, de noche, con el arbol cargado y la raiz a la vista— con el titulo
     encima. Lo genera `npm run og` contra el servidor de desarrollo, asi que la
     tarjeta no puede quedar mostrando una pieza que ya no existe: se vuelve a
     sacar y listo.

     La URL de la imagen tiene que ser ABSOLUTA — los crawlers no resuelven
     relativas— y apunta a la raiz igual que `og:url` y el canonical. Si la pieza
     termina servida desde una subruta, estas tres se mueven juntas. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mauricio Romero">
<meta property="og:title" content="Citrus × sinensis — Mauricio Romero">
<meta property="og:description" content="A scroll-driven life cycle of an orange tree, and a portfolio inside it. Six projects hang in the canopy; open one and it comes apart into the ideas it is made of.">
<meta property="og:url" content="https://www.mnr.ar/">
<meta property="og:image" content="https://www.mnr.ar/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="2400">
<meta property="og:image:height" content="1260">
<meta property="og:image:alt" content="A young orange tree at night, fruit ripening in the canopy and its taproot visible below ground, beside the name Mauricio Romero.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://www.mnr.ar/og.jpg">

<!-- El color de la barra del navegador en movil. `#0B0F0A` es la noche de la
     pieza: la etapa de imbibicion arranca oscura y sin esto el navegador pinta
     su propio blanco justo arriba del cuadro. -->
<meta name="theme-color" content="#0B0F0A">

<!-- Bodoni Moda y Newsreader se fueron por la misma razon: son tipografias de
     ALTO CONTRASTE DE TRAZO. En papel eso es elegancia; sobre un canvas que
     cambia de color con la hora del dia, los trazos finos de una didone
     desaparecen y lo que queda es un texto que hay que adivinar.
     Fraunces tiene el mismo caracter editorial con el trazo fino mucho mas
     cargado, y Source Serif 4 esta dibujada para cuerpos chicos en pantalla.
     Ninguna de las dos necesita apoyarse en el peso 300 para verse bien. -->
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
